name: Build Debug APK

on:
  push:
    branches:
      - "claude/improve-major-app-HxSTH"
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure JDK 21
        run: |
          # GitHub runners pre-install JDK 21 — no download needed
          JAVA21="${JAVA_HOME_21_X64:-}"
          if [ -n "$JAVA21" ] && [ -d "$JAVA21" ]; then
            echo "JAVA_HOME=$JAVA21" >> $GITHUB_ENV
            echo "$JAVA21/bin" >> $GITHUB_PATH
            echo "Using pre-installed JDK 21: $JAVA21"
          else
            # Fallback: find any JDK 21
            JAVA21=$(find /usr/lib/jvm -maxdepth 1 -name '*21*' -type d | head -1)
            if [ -n "$JAVA21" ]; then
              echo "JAVA_HOME=$JAVA21" >> $GITHUB_ENV
              echo "$JAVA21/bin" >> $GITHUB_PATH
              echo "Using JDK 21: $JAVA21"
            fi
          fi

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" 2>&1 || true
          fi

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode debug keystore
        run: base64 --decode debug.keystore.base64 > debug.keystore

      - name: Create .env
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'placeholder_key' }}" > .env

      - name: Verify Java
        run: java -version

      - name: Download Gradle via wrapper
        run: ./gradlew --version --no-daemon

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScholarSpace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Show APK info
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "Build succeeded!"
            ls -lh "$APK"
          fi

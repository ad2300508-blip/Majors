name: Build Debug APK

on:
  push:
    branches:
      - "claude/improve-major-app-HxSTH"
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Print environment to summary
        run: |
          {
            echo "## Build Environment"
            echo "| Key | Value |"
            echo "| --- | --- |"
            echo "| ANDROID_HOME | \`$ANDROID_HOME\` |"
            echo "| JAVA_HOME | \`$JAVA_HOME\` |"
            echo "| java -version | \`$(java -version 2>&1 | head -1)\` |"
            echo "| Platforms | \`$(ls $ANDROID_HOME/platforms/ 2>/dev/null | tr '\n' ' ')\` |"
            echo "| gradlew exists | \`$(ls -la gradlew 2>/dev/null || echo NOT FOUND)\` |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" 2>&1 || true
          fi

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode debug keystore
        run: base64 --decode debug.keystore.base64 > debug.keystore

      - name: Create .env
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'placeholder_key' }}" > .env

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g" 2>&1 | tee /tmp/gradle-output.txt
          exit ${PIPESTATUS[0]}

      - name: Show build error in summary
        if: failure()
        run: |
          {
            echo "## Gradle Error"
            echo '```'
            tail -60 /tmp/gradle-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScholarSpace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Show APK info
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "Build succeeded!"
            ls -lh "$APK"
          fi

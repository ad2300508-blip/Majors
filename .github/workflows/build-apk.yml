name: Build Debug APK

on:
  push:
    branches:
      - "claude/improve-major-app-HxSTH"
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "=== Pre-installed platforms ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "(none)"

          # Find sdkmanager regardless of cmdline-tools version
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager path: $SDKMANAGER"

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" 2>&1 || true
            # Let AGP pick the right build-tools; install fallback versions
            "$SDKMANAGER" "build-tools;35.0.0" 2>&1 || true
          fi

          echo "=== Platforms after install ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "(none)"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode debug keystore
        run: base64 --decode debug.keystore.base64 > debug.keystore

      - name: Create .env with placeholder API key
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'placeholder_key' }}" > .env

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScholarSpace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Show APK info
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "Build succeeded!"
            ls -lh "$APK"
          fi

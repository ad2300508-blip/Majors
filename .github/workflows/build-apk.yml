name: Build Debug APK

on:
  push:
    branches:
      - "claude/improve-major-app-HxSTH"
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses and install API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode debug keystore
        run: base64 --decode debug.keystore.base64 > debug.keystore

      - name: Create .env with placeholder API key
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'placeholder_key' }}" > .env

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScholarSpace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Show APK info
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "Build succeeded!"
            ls -lh "$APK"
          fi

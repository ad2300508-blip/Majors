name: Build Debug APK

on:
  push:
    branches:
      - "claude/improve-major-app-HxSTH"
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode debug keystore
        run: base64 --decode debug.keystore.base64 > debug.keystore

      - name: Create .env
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'placeholder_key' }}" > .env

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: ScholarSpace-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
